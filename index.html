<!doctype html><html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>賠率總覽</title>
<style>
:root{--ink:#1b1b1b;--line:#d8d8d8;--card:#fff;--accent:#0b6b3a;--muted:#777}
*{box-sizing:border-box}
body{margin:0;padding:24px;font:15px/1.55 -apple-system,"Helvetica Neue","PingFang HK","Microsoft JhengHei",sans-serif;color:var(--ink);background:#f6f7f6}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin:0 0 10px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--muted);padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.months,.days{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.days{padding-left:10px;border-left:3px solid #e2e8e2}
.months button,.days button{border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;padding:4px 10px;border-radius:14px;cursor:pointer;color:#41544a}
.months button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.days button.on{background:#41544a;border-color:#41544a;color:#fff}
.pane[hidden],.ov[hidden]{display:none}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
th{background:#eef2ee;font-weight:600}
td.l,th.l{text-align:left}
tr:nth-child(even) td{background:#fbfbfb}
a{color:var(--accent);text-decoration:none;cursor:pointer}
.tag{display:inline-block;padding:0 6px;border-radius:3px;background:#eef2ee;color:#41544a;font-size:12px}
.sc{font-weight:700;font-size:15px}
.ht{color:var(--muted);font-size:11px}
.st{font-size:12px;color:#b45309;font-weight:600}
.tbl a{margin:0 3px}
.empty,.load{color:var(--muted);font-size:13px;padding:12px 2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.box{background:#fff;width:min(1500px,97vw);height:93vh;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;min-width:0}
.bar span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{flex:0 0 auto;border:0;background:#eef2ee;color:#33443a;font-size:16px;line-height:1;padding:6px 10px;border-radius:4px;cursor:pointer}
.box iframe{flex:1;width:100%;border:0;background:#fff}
@media (max-width:720px){
  body{padding:12px 10px}
  h1{font-size:18px}
  .tabs button{padding:8px 10px;font-size:14px}
  table{box-shadow:none;background:transparent;font-size:14px}
  table,tbody,thead,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:#fff;padding:10px 12px}
  tr:nth-child(even) td{background:transparent}
  td{border:0;padding:1px 0;text-align:left;white-space:normal}
  td[data-l]:before{content:attr(data-l) "：";color:var(--muted);font-size:12px}
  td.mt{font-size:17px;font-weight:600;margin:2px 0 4px}
  td.tbl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  td.tbl a{flex:1 1 44%;text-align:center;padding:11px 0;border:1px solid var(--line);border-radius:8px;background:#f6f8f6;font-size:14px}
  .ov{padding:0}
  .box{width:100vw;height:100vh;height:100dvh;max-height:100%;border-radius:0}
  .bar{font-size:13px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
  .bar span{max-width:calc(100vw - 90px)}
  .bar button{font-size:20px;padding:8px 14px;margin-right:env(safe-area-inset-right)}
}
</style></head><body>
<h1>賠率總覽</h1>
<div class="sub" id="meta">載入中…</div>
<div class="tabs">
 <button class="on" data-p="pre">未開賽</button>
 <button data-p="live">比賽中</button>
 <button data-p="post">已完場</button>
</div>
<div id="filter" hidden></div>
<section id="pre" class="pane"><div class="load">載入中…</div></section>
<section id="live" class="pane" hidden><div class="load">載入中…</div></section>
<section id="post" class="pane" hidden><div class="load">載入中…</div></section>
<div id="ov" class="ov" hidden><div class="box">
 <div class="bar"><span id="ttl"></span><button id="x" title="關閉">✕</button></div>
 <iframe id="fr"></iframe>
</div></div>
<script>
var ST={0:"未開賽",1:"上半場",2:"中場",3:"下半場",4:"加時",5:"十二碼",-1:"完場",-10:"取消",-11:"待定",-12:"腰斬",-13:"中斷",-14:"推遲"};
var RUN=[1,2,3,4,5];
var S={days:[],today:"",cache:{},tab:"pre",month:"",day:""};
var TCSS="body{font-family:-apple-system,\"PingFang HK\",\"Microsoft JhengHei\",sans-serif;margin:26px;color:#222}\n h1{font-size:17px;margin:0 0 4px}\n h2{font-size:14px;margin:22px 0 8px;color:#333;border-left:4px solid #4a6fa5;padding-left:8px}\n .sub{font-size:12px;color:#666;margin-bottom:14px}\n table{border-collapse:collapse;font-size:13px;margin-bottom:8px}\n th,td{border:1px solid #bbb;padding:4px 10px;text-align:center;white-space:nowrap}\n thead th{background:#f0f0f0}\n thead tr:first-child th{background:#e4e9f2}\n tr.grp td{background:#e9eef5;text-align:left;font-weight:600;padding:5px 10px}\n td.red{background:#fbdcdc}\n td.yellow{background:#fdf3c4}\n td.gap{background:#fff;color:#999;font-style:italic;text-align:left}\n td.c{color:#999;font-size:11px;width:22px}\n td.t{color:#333}\n td.small{font-size:11px;color:#666;text-align:left}\n td.diff{background:#fff}\n td.top{background:#ffe600;font-weight:700;box-shadow:inset 0 0 0 2px #d4a000}\n td.sp{border:none;background:#fff;width:10px}\n td.odds{background:#fff}\n td.payout{background:#fff;color:#333;line-height:1.25}\n td.payout.up{background:#fbdcdc}\n td.payout.down{background:#fdf3c4}\n td.rise{color:#c00;font-weight:700}\n td.fall{color:#0047bb;font-weight:700}\n td.flatd{color:#333}\n td.zero{color:#888}\n td.net{background:#e8f5e9;font-weight:700}\n td.nm{text-align:left;background:#fafafa;font-weight:600}\n td.cnt{color:#777;font-size:11px}\n tr.total td{background:#f2f4f8;border-top:2px solid #8899b0;font-size:14px;font-weight:700}\n tr.total td.nm{background:#e3e9f2;font-size:15px;font-weight:800}\n tr.total td.net{background:#a5d6a7;font-size:17px;font-weight:800;color:#0f3d1a;box-shadow:inset 0 0 0 2px #43a047}\n tr.total td.net.rise{color:#8b0000}\n tr.total td.net.fall{color:#002f6c}\n .x2{font-size:9px;color:#a33;margin-left:2px;vertical-align:super}\n .tag{font-size:10px;color:#888;margin-left:4px}\n .dp{font-size:11px;color:#666}\n .legend{margin-top:12px;font-size:12px;color:#555}\n .sw{display:inline-block;width:13px;height:13px;vertical-align:-2px;border:1px solid #bbb;margin-right:4px}\n .note{margin-top:6px;font-size:12px;color:#666;line-height:1.6}";

function j(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(u);return r.json();});}
function loadDay(d){if(S.cache[d])return Promise.resolve(S.cache[d]);return j("data/"+d+".json").then(function(o){S.cache[d]=o;return o;});}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hc(h){h=Number(h)||0;if(!h)return "平手";return h>0?("主讓 "+h):("客讓 "+(-h));}
function isPre(s){return (s||0)===0;}
function isLive(s){return RUN.indexOf(s||0)>=0;}
function isPost(s){var v=s||0;return v!==0&&RUN.indexOf(v)<0;}
function ago(n){var d=new Date(S.today+"T00:00:00");d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}

function scoreHtml(m){var s="";if(m.ft_h!=null&&m.ft_a!=null){s="<div class='sc'>"+m.ft_h+"–"+m.ft_a+"</div>";
 if(m.ht_h!=null&&m.ht_a!=null)s+="<div class='ht'>半 "+m.ht_h+"–"+m.ht_a+"</div>";}return s;}

function rowHtml(m,kind){
  var cells="";
  if(kind==="post"){cells="<td data-l='比分'>"+(scoreHtml(m)||("<span class='st'>"+esc(ST[m.status]||"—")+"</span>"))+"</td>";}
  else if(kind==="live"){cells="<td data-l='狀態'><span class='st'>"+esc(ST[m.status]||"—")+"</span></td><td data-l='比分'>"+(scoreHtml(m)||"—")+"</td>";}
  var links="—";
  if(m.has_tables){
    var t=esc(m.league+" "+m.home+" "+m.away+" — ");
    links="<a class='mdl' data-mid='"+m.mid+"' data-kind='red' data-title=\""+t+"紅區\">紅區</a> <a class='mdl' data-mid='"+m.mid+"' data-kind='sum' data-title=\""+t+"加總\">加總</a>";
  }
  return "<tr><td data-l='開賽'>"+esc(m.kickoff)+"</td><td class='l' data-l='聯賽'>"+esc(m.league)+"</td>"
   +"<td class='l mt'>"+esc(m.home)+" vs "+esc(m.away)+"</td>"+cells
   +"<td data-l='讓球盤'><span class='tag'>"+hc(m.hcap)+"</span></td><td class='tbl'>"+links+"</td></tr>";
}

function tableHtml(tk){
  if(!tk)return "<p style='font:15px sans-serif;padding:16px;color:#777'>冇表。</p>";
  var h=tk.pre||"";
  h+="<table><thead>";
  (tk.head||[]).forEach(function(r){h+="<tr>";r.forEach(function(c){h+="<th"+(c[1]?" class='"+c[1]+"'":"")+(c[2]?" colspan='"+c[2]+"'":"")+">"+c[0]+"</th>";});h+="</tr>";});
  h+="</thead><tbody>";
  (tk.rows||[]).forEach(function(r){h+="<tr"+(r[0]?" class='"+r[0]+"'":"")+">";
    r[1].forEach(function(c){h+="<td"+(c[1]?" class='"+c[1]+"'":"")+(c[2]?" colspan='"+c[2]+"'":"")+">"+c[0]+"</td>";});h+="</tr>";});
  h+="</tbody></table>"+(tk.foot||"");
  return h;
}

function renderList(el,rows,kind,empty){
  if(!rows.length){el.innerHTML="<div class='empty'>"+empty+"</div>";return;}
  var head="<th>開賽 (UTC+8)</th><th class='l'>聯賽</th><th class='l'>對賽</th>"
   +(kind==="post"?"<th>比分</th>":(kind==="live"?"<th>狀態</th><th>比分</th>":""))
   +"<th>讓球盤</th><th>表</th>";
  el.innerHTML="<table><thead><tr>"+head+"</tr></thead><tbody>"
   +rows.map(function(m){return rowHtml(m,kind);}).join("")+"</tbody></table>";
  bindModal(el);
}

function bindModal(el){
  el.querySelectorAll("a.mdl").forEach(function(a){
    a.onclick=function(){
      var mid=a.getAttribute("data-mid"),kind=a.getAttribute("data-kind");
      var d=(S.tab==="post"&&S.day)?S.day:S.today;
      loadDay(d).catch(function(){return loadDay(S.day||S.today);}).then(function(o){
        var m=(o.matches||[]).filter(function(x){return x.mid===mid;})[0];
        var tk=m&&m.tables?m.tables[kind]:null;
        document.getElementById("ttl").textContent=a.getAttribute("data-title");
        document.getElementById("fr").srcdoc="<!doctype html><meta charset='utf-8'><style>"+TCSS+"</style>"+tableHtml(tk);
        document.getElementById("ov").hidden=false;document.body.style.overflow="hidden";
      });
    };
  });
}

function closeOv(){document.getElementById("ov").hidden=true;document.getElementById("fr").srcdoc="";document.body.style.overflow="";}
document.getElementById("x").onclick=closeOv;
document.getElementById("ov").onclick=function(e){if(e.target===this)closeOv();};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeOv();});

function sums(){var n={pre:0,live:0,post:0};S.days.forEach(function(d){n.pre+=d.pre;n.live+=d.live;n.post+=d.post;});return n;}
function setTabs(){
  var n=sums(),L={pre:"未開賽",live:"比賽中",post:"已完場"};
  document.querySelectorAll(".tabs button").forEach(function(b){
    var p=b.getAttribute("data-p");
    b.textContent=L[p]+" "+n[p];
    b.classList.toggle("on",p===S.tab);
  });
}

function showFilter(){
  var f=document.getElementById("filter");
  if(S.tab!=="post"){f.hidden=true;f.innerHTML="";return;}
  var ms={},ds={};
  S.days.forEach(function(d){if(!d.post)return;var ym=d.d.slice(0,7);ms[ym]=(ms[ym]||0)+d.post;ds[d.d]=d.post;});
  var h="<div class='months'><button data-m='' class='"+(S.month===""?"on":"")+"'>全部 ("+sums().post+")</button>";
  Object.keys(ms).sort().reverse().forEach(function(k){h+="<button data-m='"+k+"' class='"+(S.month===k?"on":"")+"'>"+k+" ("+ms[k]+")</button>";});
  h+="</div><div class='days'><button data-d='' class='"+(S.day===""?"on":"")+"'>全部日子</button>";
  Object.keys(ds).sort().reverse().forEach(function(k){
    if(S.month&&k.slice(0,7)!==S.month)return;
    h+="<button data-d='"+k+"' class='"+(S.day===k?"on":"")+"'>"+Number(k.slice(8,10))+"日 ("+ds[k]+")</button>";});
  h+="</div>";
  f.hidden=false;f.innerHTML=h;
  f.querySelectorAll(".months button").forEach(function(b){b.onclick=function(){S.month=b.getAttribute("data-m");S.day="";showFilter();renderTab();};});
  f.querySelectorAll(".days button").forEach(function(b){b.onclick=function(){S.day=b.getAttribute("data-d");showFilter();renderTab();};});
}

function renderTab(){
  ["pre","live","post"].forEach(function(k){document.getElementById(k).hidden=(k!==S.tab);});
  var el=document.getElementById(S.tab);
  el.innerHTML="<div class='load'>載入中…</div>";
  if(S.tab==="post"){
    var d=S.day||(S.days.filter(function(x){return x.post>0;})[0]||{d:S.today}).d;
    loadDay(d).then(function(o){
      renderList(el,(o.matches||[]).filter(function(m){return isPost(m.status);}),"post","這日冇已完場比賽。");
    }).catch(function(){el.innerHTML="<div class='empty'>讀不到 "+d+" 的資料。</div>";});
  }else if(S.tab==="live"){
    var cand=S.days.filter(function(x){return x.d>=ago(1)&&x.d<=S.today;}).map(function(x){return x.d;});
    if(!cand.length){el.innerHTML="<div class='empty'>現時沒有進行中的比賽。</div>";return;}
    Promise.all(cand.map(loadDay)).then(function(os){
      var rows=[];os.forEach(function(o){(o.matches||[]).forEach(function(m){if(isLive(m.status))rows.push(m);});});
      rows.sort(function(a,b){return b.kickoff_ms-a.kickoff_ms;});
      renderList(el,rows,"live","現時沒有進行中的比賽。");
    });
  }else{
    var fut=S.days.filter(function(x){return x.d>=S.today;}).map(function(x){return x.d;});
    if(!fut.length){el.innerHTML="<div class='empty'>暫無未開賽的比賽。</div>";return;}
    Promise.all(fut.map(loadDay)).then(function(os){
      var rows=[];os.forEach(function(o){(o.matches||[]).forEach(function(m){if(isPre(m.status))rows.push(m);});});
      rows.sort(function(a,b){return a.kickoff_ms-b.kickoff_ms;});
      renderList(el,rows,"pre","暫無未開賽的比賽。");
    });
  }
}

document.querySelectorAll(".tabs button").forEach(function(b){
  b.onclick=function(){S.tab=b.getAttribute("data-p");setTabs();showFilter();renderTab();};
});

j("data/days.json").then(function(idx){
  S.days=idx.days||[];S.today=idx.today;
  var n=sums();
  document.getElementById("meta").textContent="來源 goal1.xml　讓球盤 0 / ±0.25 / ±0.5　共 "+(n.pre+n.live+n.post)+" 場　更新 "+idx.generated+"（UTC+8）";
  setTabs();showFilter();renderTab();
}).catch(function(e){document.getElementById("meta").textContent="載入失敗："+e.message;});
</script>
</body></html>
